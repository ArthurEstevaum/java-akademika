# --- Mantenha create-drop ou mude para update ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Habilite a integração do Docker Compose ---
# Isso ajudará o Spring a esperar o Postgres iniciar
spring.docker.compose.enabled=false

api.security.token.secret=

spring.ai.openai.api-key=

spring.ai.vectorstore.milvus.host=localhost
spring.ai.vectorstore.milvus.port=19530
spring.ai.vectorstore.milvus.uri=http://localhost:19530